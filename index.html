<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSO Widgets: Yandex & VK ID</title>
    
    <!-- SDK Яндекса и VK -->
    <script src="https://yastatic.net/s3/passport-sdk/autofill/v1/sdk-suggest-with-polyfills-latest.js"></script>
    <script src="https://yastatic.net/s3/passport-static/autofill/1.84.0/client/suggest.js"></script>
    <script src="https://unpkg.com/@vkid/sdk@<3.0.0/dist-sdk/umd/index.js"></script>

    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 20px; 
            max-width: 600px; 
            margin: auto; 
            background-color: #f4f4f9; 
        }
        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            margin-bottom: 20px; 
        }
        h2 { color: #2c3e50; margin-top: 0; }
        
        /* Выравнивание кнопок в ряд */
        .widget-row { 
            display: flex; 
            gap: 20px; 
            margin-top: 20px; 
            align-items: center; /* Центрируем по вертикали */
            flex-wrap: wrap; 
        }
        
        /* Контейнеры для виджетов */
        #yandex-container, #vk-container { 
            height: 44px; /* Фиксируем высоту кнопок */
            display: flex;
            align-items: center;
        }

        /* --- ФИКС ДЛЯ VK ID --- */
        /* Скрываем назойливый текст "или войти через..." от виджета ВК */
        .VkIdSdk_oauth_link_text { 
            display: none !important; 
        }
        /* Убираем лишние отступы внутри контейнера ВК, если они появятся */
        .VkIdSdk_oauth_container {
            margin: 0 !important;
            padding: 0 !important;
        }
        /* ----------------------- */
        
        pre { 
            background: #282c34; 
            color: #98c379; 
            padding: 15px; 
            border-radius: 5px; 
            overflow-x: auto; 
            white-space: pre-wrap; 
            font-size: 14px; 
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Авторизация</h2>
        <div class="widget-row">
            <!-- Сюда встроятся оригинальные виджеты -->
            <div id="yandex-container"></div>
            <div id="vk-container"></div>
        </div>
    </div>

    <div class="card">
        <h2>Access Token</h2>
        <pre id="logOutput">Ожидание входа...</pre>
    </div>

    <script>
        // ==========================================
        // НАСТРОЙКИ (Вставьте свои данные)
        // ==========================================
        const YANDEX_CLIENT_ID = 'f287fcecc918470f9cf622467cac3a45';
        const VK_APP_ID = 54557000; // Укажите ваш ID приложения VK
        
        const CURRENT_URL = window.location.href.split('#')[0];

        // ==========================================
        // ФУНКЦИЯ ВЫВОДА И КОПИРОВАНИЯ ТОКЕНА
        // ==========================================
        function handleTokenSuccess(provider, token) {
            const out = document.getElementById('logOutput');
            out.textContent = `[${provider}] Access Token:\n${token}`;

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(token)
                    .then(() => { out.textContent += '\n\n✅ Успешно скопировано в буфер обмена!'; })
                    .catch(err => { out.textContent += `\n\n❌ Ошибка копирования: ${err}`; });
            } else {
                out.textContent += '\n\n⚠️ Скопируйте токен вручную (буфер обмена недоступен без HTTPS).';
            }
        }

        // ==========================================
        // 1. ЛОГИКА ЯНДЕКСА
        // ==========================================
        if (window.location.hash.includes('access_token=')) {
            const token = new URLSearchParams(window.location.hash.substring(1)).get('access_token');
            if (token && window.opener) {
                window.opener.postMessage({ type: 'YANDEX_TOKEN', token: token }, window.location.origin);
                window.close();
            }
        }

        window.addEventListener('message', (event) => {
            if (event.origin === window.location.origin && event.data?.type === 'YANDEX_TOKEN') {
                handleTokenSuccess('Yandex', event.data.token);
            }
        });

        function initYandex() {
            if (!YANDEX_CLIENT_ID || YANDEX_CLIENT_ID.includes('ВАШ_')) return;

            window.YaAuthSuggest.init(
                { client_id: YANDEX_CLIENT_ID, response_type: 'token', redirect_uri: CURRENT_URL },
                window.location.origin,
                { view: 'button', parentId: 'yandex-container', buttonSize: 'm', buttonView: 'main', buttonTheme: 'light', buttonBorderRadius: '4' }
            )
            .then(({ handler }) => handler())
            .then(data => handleTokenSuccess('Yandex', data.access_token))
            .catch(console.error);
        }

        // ==========================================
        // 2. ЛОГИКА VK ID
        // ==========================================
        function initVK() {
            if (!('VKIDSDK' in window)) return;
            const VKID = window.VKIDSDK;

            VKID.Config.init({
                app: VK_APP_ID,
                redirectUrl: CURRENT_URL,
                responseMode: VKID.ConfigResponseMode.Callback,
                source: VKID.ConfigSource.LOWCODE
            });

            const oAuth = new VKID.OAuthList();
            
            oAuth.render({
                container: document.getElementById('vk-container'),
                oauthList: ['vkid']
            })
            .on(VKID.OAuthListInternalEvents.LOGIN_SUCCESS, function (payload) {
                VKID.Auth.exchangeCode(payload.code, payload.device_id)
                    .then(data => {
                        const token = data.access_token || JSON.stringify(data);
                        handleTokenSuccess('VK ID', token);
                    })
                    .catch(console.error);
            })
            .on(VKID.WidgetEvents.ERROR, console.error);
        }

        // ==========================================
        // ЗАПУСК
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            initYandex();
            initVK();
        });
    </script>
</body>
</html>
